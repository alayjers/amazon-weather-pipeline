version: '3.8'

services:
  airflow:
    build: .
    container_name: weather_airflow
    ports:
      - "8080:8080"
    environment:
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=sqlite:////opt/airflow/airflow.db
      - AIRFLOW__CORE__LOAD_EXAMPLES=False
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - .:/opt/airflow/project
      - ~/.aws:/home/airflow/.aws:ro
      - ~/.dbt:/home/airflow/.dbt:ro
    command: >
      bash -c "airflow db migrate &&
               airflow users create --username elijah --password admin --firstname Elijah --lastname Gutierrez --role Admin --email admin@example.com &&
               (airflow scheduler & exec airflow webserver)"