name: Scheduled APAC Weather Pipeline

on:
  schedule:
    - cron: '0 */3 * * *'  # Runs every 3 hours UTC automatically
  workflow_dispatch:       # Lets you trigger a manual run anytime from GitHub UI

jobs:
  run-etl:
    runs-on: ubuntu-latest
    env:
      PIPELINE_ENV: prod
      OPENWEATHER_API_KEY: ${{ secrets.OPENWEATHER_API_KEY }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: ap-southeast-2

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install pipeline dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt "dlt[s3,parquet]" dbt-duckdb requests

      - name: Ingest multi-city OpenWeather data to S3 Bronze
        run: python ingest.py

      - name: Build dbt Star Schema and run quality tests
        working-directory: weather_transform
        run: dbt build --target prod --profiles-dir .