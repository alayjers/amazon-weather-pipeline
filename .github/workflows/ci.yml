name: Data Pipeline CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate-python-and-dbt:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies and linters
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt dbt-duckdb ruff

      - name: Lint and compile Python files
        run: |
          ruff check ingest.py app.py airflow/dags/ --select E9,F63,F7,F82
          python -m py_compile ingest.py app.py airflow/dags/*.py

      - name: Parse and validate dbt models and tests
        working-directory: weather_transform
        run: |
          dbt parse --target dev --profiles-dir .