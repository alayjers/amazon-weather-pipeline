name: Keep Streamlit App Awake

on:
  schedule:
    - cron: '0 */6 * * *'  # Visits the app every 6 hours UTC
  workflow_dispatch:       # Allows manual testing from the GitHub Actions tab

jobs:
  ping-streamlit:
    runs-on: ubuntu-latest

    steps:
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Playwright and Chromium
        run: |
          pip install playwright
          playwright install chromium

      - name: Open Streamlit App via Headless Browser
        env:
          APP_URL: ${{ vars.STREAMLIT_APP_URL }}
        run: |
          python -c "
          import os
          from playwright.sync_api import sync_playwright

          url = os.environ['APP_URL']
          with sync_playwright() as p:
              browser = p.chromium.launch(headless=True)
              page = browser.new_page()
              page.goto(url, wait_until='networkidle', timeout=60000)

              # If the app was already asleep, click Streamlit's wake-up button
              wake_btn = page.locator('button:has-text(\"Yes, get this app back up\")')
              if wake_btn.count() > 0:
                  print('App was sleeping — clicking wake-up button...')
                  wake_btn.first.click()
                  page.wait_for_timeout(15000)

              # Wait 10s so the WebSocket connects and DuckDB renders the Gold marts
              page.wait_for_timeout(10000)
              print('Page title:', page.title())
              browser.close()
          "